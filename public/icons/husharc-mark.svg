<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer orbital arc (interrupted) -->
  <path
    d="M 50 10 A 40 40 0 1 1 14 65"
    stroke="#D5FF70"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="160 30"
    opacity="0.9"
  />
  
  <!-- Middle orbital arc (counter-phase, interrupted) -->
  <path
    d="M 78 50 A 28 28 0 1 1 50 22"
    stroke="#53645A"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="110 25"
  />
  
  <!-- Inner delicate arc -->
  <path
    d="M 34 50 A 16 16 0 0 1 66 50"
    stroke="#D5FF70"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.6"
  />

  <!-- Central living signal point -->
  <circle cx="50" cy="50" r="4.5" fill="#D5FF70">
    <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="50" r="8" stroke="#D5FF70" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="6;11;6" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
