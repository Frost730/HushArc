<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="HushArc — Anonymous, ephemeral, end-to-end encrypted messaging. Some things belong in the moment." />
    <meta name="theme-color" content="#0A0E0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" type="image/svg+xml" href="/icons/husharc-mark.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>HushArc — Living Signal</title>

    <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-ink text-text-primary antialiased selection:bg-signal-lime selection:text-ink overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register minimal static-only PWA service worker
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Ignore SW registration failures gracefully in dev/unsupported environments
          });
        });
      }
    </script>
  </body>
</html>
