services:
  - type: web
    name: husharc
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --no-audit && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.4
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
